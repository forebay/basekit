plugins {
    id "io.github.intisy.github-gradle" version "1.10.3" apply false
}

subprojects {
    apply plugin: "java-library"
    apply plugin: "io.github.intisy.github-gradle"

    group = "io.github.intisy"
    // publishGithub requires a concrete version. Derive it from -Partifact_version=<tag> passed by
    // CI (stripping a leading "v"), falling back to a local dev version, the ecosystem derivation.
    version = (project.findProperty("artifact_version") ?: "0.0.0-dev").toString().replaceFirst(/^v/, "")

    github {
        accessToken = System.getenv("GITHUB_TOKEN") ?: ""
    }

    repositories {
        mavenLocal()
        mavenCentral()
    }

    java {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8

        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    // All Java source, main and test alike, must stay within the JDK 1.8 API surface; javac enforces it.
    tasks.matching { it.name == "compileJava" || it.name == "compileTestJava" }.configureEach {
        options.release = 8
    }

    tasks.withType(Javadoc).configureEach {
        options.addBooleanOption("Xdoclint:all", true)
        // javadoc stops listing after 100 of each by default, which silently under-reports the gap.
        options.addStringOption("Xmaxwarns", "10000")
        options.addStringOption("Xmaxerrs", "10000")
        // doclint reports a missing comment as a WARNING, and failOnError only fails on errors, so
        // without this the task passes over an entirely undocumented module.
        options.addBooleanOption("Werror", true)
        options.tags = [
            "apiNote:a:API Note:",
            "implSpec:a:Implementation Requirements:",
            "implNote:a:Implementation Note:",
        ]
        failOnError = true
    }

    // check does not run javadoc by default, so without this a doclint finding fails no build.
    tasks.named("check") { dependsOn tasks.named("javadoc") }

    dependencies {
        testImplementation "org.junit.jupiter:junit-jupiter:5.10.1"
    }

    test {
        useJUnitPlatform()
    }
}

// The modules a downstream java repo resolves, mapped to the classifier its coordinate names.
// Per module rather than one shaded jar, because they serve different gradle configurations and
// shading would put every module on every consumer's classpath.
ext.PUBLISHED_MODULES = [
    ":contracts": "contracts",
    ":ir": "ir",
    ":js-base": "js-base",
    ":accounts": "accounts",
    ":auth-contracts": "auth-contracts",
    ":routing": "routing",
    ":proxy-contracts": "proxy-contracts",
]

// Only :ir ships test fixtures; every vendor translator's tests consume them. Declaring an artifact
// whose file is never built fails the publish, so the list is explicit rather than every module.
ext.FIXTURE_MODULES = [":ir"]

configure(subprojects.findAll { PUBLISHED_MODULES.containsKey(it.path) }) {
    jar {
        archiveVersion = ""
    }

    // The test fixtures are consumed by every vendor translator's own tests, so they are published
    // alongside the module rather than duplicated per translator. Unversioned for the same reason
    // the main jar is: the release asset's name is the coordinate consumers write.
    if (project.path in rootProject.FIXTURE_MODULES) {
        tasks.matching { it.name == "testFixturesJar" }.configureEach {
            archiveVersion = ""
        }

        // Declaring the artifact does not build it, and CI publishes with `:<module>:jar
        // :<module>:publishGithub`, which reaches no other jar task.
        tasks.matching { it.name == "publishGithub" }.configureEach {
            dependsOn tasks.matching { it.name == "testFixturesJar" }
        }
    }

    publishGithub {
        // These modules sit inside this repo with no .git of their own, so the default git-remote
        // lookup fails; owner/repo also drive the uploaded asset name (basekit-<classifier>.jar).
        owner = "forebay"
        repo = "basekit"
        releaseName = "basekit ${project.findProperty('artifact_version') ?: project.version}"
        artifacts {
            artifact {
                classifier = PUBLISHED_MODULES[project.path]
                jar = file("build/libs/${project.name}.jar")
            }
            if (project.path in rootProject.FIXTURE_MODULES) {
                artifact {
                    classifier = "${PUBLISHED_MODULES[project.path]}-test-fixtures"
                    jar = file("build/libs/${project.name}-test-fixtures.jar")
                }
            }
        }
    }
}

// A publish fanned out to every subproject would fail on the ones with no artifacts declared.
subprojects {
    tasks.matching { it.name == "publishGithub" }.configureEach {
        onlyIf { project.path in rootProject.PUBLISHED_MODULES.keySet() }
    }
}
