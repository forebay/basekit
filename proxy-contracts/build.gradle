// The routing vocabulary a proxy plugin implements, and the front-door key core-proxy mints. Kept
// apart from :routing so a plugin implementing ProxyHandler or ProxyPlugin does not link the engine.
//
// Every dependency is compileOnly: the annotations are SOURCE-retention, the api contract supplies
// the seam and typed-key interfaces, and :ir supplies types this module names but never constructs.
dependencies {
    githubCompileOnly "weivel:java:1.8.0:annotations"
    githubCompileOnly "weivel:java:1.8.0:contract"
    compileOnly project(":ir")
    githubAnnotationProcessor "weivel:java:1.8.0:processor"
    githubAnnotationProcessor "weivel:java:1.8.0:annotations"
}

tasks.named("compileJava") {
    options.compilerArgs += [
        "-Atsemit.name=proxy-contracts",
        "-Atsemit.ext=.ts",
        // Relative paths into the submodules rather than package specifiers: this repo reaches api
        // and core-ir the same way its hand-written sources do.
        "-Atsemit.keys=@intisy/bayonet/contract",
        "-Atsemit.imports=../types.js=FrontDoorCapability",
    ]
}
