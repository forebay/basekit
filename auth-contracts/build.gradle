// The annotations are SOURCE-retention, the api contract supplies the seam and typed-key interfaces,
// and :ir supplies types this module names but never constructs. So all three are compileOnly: this
// module's jar carries none of them, and no :teavm module embeds a second copy of any.
dependencies {
    githubCompileOnly "weivel:java:1.8.0:annotations"
    githubCompileOnly "weivel:java:1.8.0:contract"
    compileOnly project(":ir")
    githubAnnotationProcessor "weivel:java:1.8.0:processor"
    githubAnnotationProcessor "weivel:java:1.8.0:annotations"
}

tasks.named("compileJava") {
    options.compilerArgs += [
        "-Atsemit.name=auth-contracts",
        "-Atsemit.ext=.ts",
        "-Atsemit.keys=@intisy/bayonet/contract",
        "-Atsemit.imports=../../ir/index.js=IrRequest,IrResponse,IrEventStream,HandlerCtx",
    ]
}
