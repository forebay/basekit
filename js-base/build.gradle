plugins {
    id "org.teavm" version "0.15.0"
}

dependencies {
    api project(":ir")
    githubCompileOnly "weivel:java:1.8.0:contract"
    teavm teavm.libs.jsoApis
}

// TeaVM 0.15.0's classlib, jso-apis and extension-spi artifacts publish a minimum-JVM metadata above
// 8, so this module needs 17 on both compile steps: the extension's compatibility fixes Gradle's
// JVM-version attribute matching, and the task options fix javac. Mirrors api's :js-base exactly.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.named("compileJava") {
    options.release = 17
}

tasks.named("compileTestJava") {
    options.release = 17
}
